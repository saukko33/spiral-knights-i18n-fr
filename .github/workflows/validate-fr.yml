name: Validate French translations

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-fr:
    name: Validate French properties
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate changed French bundles
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 tools/validate_fr.py
